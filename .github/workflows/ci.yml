name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run Ruff Lint
        run: |
          uv run --frozen ruff check .

      - name: Run Ruff Format Check
        run: |
          uv run --frozen ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          uv run --frozen mypy app tests

      - name: Run Pytest Suite
        run: |
          uv run --frozen pytest

      - name: Build production images and verify gateway kernel policy
        run: |
          docker build -t tebypass:ci .
          docker build -f gateway/Dockerfile -t tebypass-gateway:ci .
          docker run --rm --cap-add NET_ADMIN -e PYTHONPATH=/ --entrypoint python3 -v "$PWD/scripts/verify_gateway_network.py:/verify.py:ro" tebypass-gateway:ci /verify.py

      - name: Verify forwarded client DNS, HTTP and fail-closed
        run: python scripts/verify_gateway_forwarding.py --image tebypass-gateway:ci
