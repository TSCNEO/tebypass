services:
  tebypass:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tebypass
    restart: unless-stopped
    ports:
      - "${TEBYPASS_PORT:-9384}:9384"
    environment:
      # Bootstrap only: listen port and database location.
      # Every other setting (router driver, credentials, feeds, intervals, WireGuard)
      # lives in SQLite inside the data volume and is configured from the web interface.
      - TEBYPASS_PORT=${TEBYPASS_PORT:-9384}
      - TEBYPASS_DATABASE_URL=${TEBYPASS_DATABASE_URL:-sqlite+aiosqlite:////data/tebypass.db}
    volumes:
      - tebypass-data:/data
      - ./.git:/app/.git:ro

  # Optional Virtual Gateway sidecar for carrier router environments.
  # Reads the WireGuard config uploaded from the web UI (same data volume).
  tebypass-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: tebypass-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - tebypass-data:/data
    profiles:
      - gateway

volumes:
  tebypass-data:
