<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TeByPass · Acceso</title>
<style>body{background:#0d0f12;color:#e5e7eb;font:16px system-ui;display:grid;place-items:center;min-height:95vh}form{background:#16191f;border:1px solid #262b35;padding:2rem;max-width:24rem}h1{font:600 1.2rem ui-monospace;color:#f59e0b}input,button{box-sizing:border-box;width:100%;padding:.8rem;margin-top:1rem;background:#0d0f12;color:inherit;border:1px solid #262b35}button{color:#f59e0b;cursor:pointer}p{color:#9ca3af;font-size:.9rem}#error{color:#ef4444}</style>
<form id="login"><h1>TEBYPASS / ACCESO</h1><p>Introduce la clave de administración de esta instalación.</p><label>Clave de administración<input id="token" type="password" autocomplete="current-password" required autofocus></label><button>Entrar</button><p id="error" role="alert"></p></form>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/auth/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value})});if(!r.ok)throw Error('No se pudo iniciar sesión. Revisa la clave.');location.href='/'}catch(e){document.querySelector('#error').textContent=e.message}};</script></html>
